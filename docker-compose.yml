version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Command to pull the model on startup if it's not present
    # This ensures the model is available for the app service
    command: >
      bash -c "
        ollama serve &
        sleep 5 &&
        ollama pull ${OLLAMA_MODEL:-llama3.1} || true &
        wait -n
      "
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped

  app:
    build: .
    container_name: telegram-content-agent
    ports:
      - "8080:8080"
    environment:
      # Load all environment variables from .env file
      # This assumes .env is present in the same directory as docker-compose.yml
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GOOGLE_SHEETS_CREDENTIALS_B64=${GOOGLE_SHEETS_CREDENTIALS_B64}
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID}
      - GOOGLE_WORKSHEET_NAME=${GOOGLE_WORKSHEET_NAME}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - STYLE_DB_PATH=${STYLE_DB_PATH:-/data/styles.db}
      - GENERATION_DB_PATH=${GENERATION_DB_PATH:-/data/generations.db}
      - HEALTH_HOST=${HEALTH_HOST:-0.0.0.0}
      - HEALTH_PORT=${HEALTH_PORT:-8080}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-120}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - RETRY_DELAY_SECONDS=${RETRY_DELAY_SECONDS:-2}
      - MAX_URL_CONTENT_SIZE_MB=${MAX_URL_CONTENT_SIZE_MB:-5}
      - MAX_PDF_FILE_SIZE_MB=${MAX_PDF_FILE_SIZE_MB:-10}
    volumes:
      - app_data:/data # Volume for SQLite databases
    depends_on:
      ollama:
        condition: service_healthy # Wait for Ollama to be healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  ollama_data:
  app_data:
